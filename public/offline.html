<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0C">
<title>You are offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A0A0C;color:#F2F2F5;font-family:system-ui,-apple-system,Segoe UI,sans-serif;text-align:center;padding:24px}
  .logo{width:64px;height:64px;border-radius:16px;background:#E8352B;display:block;margin:0 auto 20px}
  h1{font-size:22px;margin:0 0 8px} p{color:#9A9AA8;font-size:14px;margin:0 0 24px;line-height:1.6}
  button{background:#E8352B;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:600}
</style>
</head>
<body>
  <div>
    <img class="logo" src="/icons/icon-192.png" alt="">
    <h1>You are offline</h1>
    <p>Check your internet connection. Pages you opened recently may still be available.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
